name = "aicrew-academy"
account_id = "fb8f04a5cf9422817fd47ab1084380c7"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# 커스텀 도메인 — Cloudflare가 DNS·SSL 자동 처리
[[routes]]
pattern = "ai.toolb.kr"
custom_domain = true

# D1 (gallery DB) — wrangler d1 create aicrew-gallery 후 database_id 채우기
[[d1_databases]]
binding = "DB"
database_name = "aicrew-gallery"
database_id = "6b645e18-5ea6-462c-9b06-7096935361f1"
migrations_dir = "migrations"

# R2 (gallery 이미지 호스팅)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aicrew-gallery"

# 관리자 비밀번호는 wrangler secret put ADMIN_PASSWORD로 등록.
# 로컬 dev용 비밀번호는 .dev.vars 파일에 별도 보관 (gitignore 됨).
